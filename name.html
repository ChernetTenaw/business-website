
<!DOCTYPE html>
<html>

<head>
<style>
.dark {
background-color: black;
color: white;
}
</style>
</head>

<body>

<h1>My Business</h1>

<button onclick="toggleTheme()">Change Theme</button>

<button onclick="askName()">Enter Name</

button>

<script>
function toggleTheme() {
document.body.classList.toggle("dark");
}

function askName() {
let name = prompt("Enter your name");
alert("Welcome " + name);
}
</script>

</body>
</html>
