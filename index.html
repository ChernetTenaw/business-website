<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Business Portfolio</title>

    <style>
       
        .dark {
             background-color: black;
            color: white;
}
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f4f4;
        }

        header {background:#1e3a8a;
            color:white;  
            padding: 20px;
            text-align: center;

        }

        nav {
            background: #555;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 0 10px;
            text-decoration: none;
        }

        section {
            padding: 20px;
            margin: 10px;
            background:#f4f4f4;
            border-radius: 5px;
        }
        /* Dark mode */
        .dark section{background: #1e1e1e;}
        button{
            padding:10px 20px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            transition: 0.3s;
            transition: transform 0.3s;
           }
           button:hover{transform: scale(1.1);}
        .project:hover{transform: scale(1.05);transition: 0.3s;}
        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 10px;
        }
         html{scroll-behavior: smooth;}
        @media(max-width:768px){nav{display:block;}}
        
    </style>
</head>

<body>

<header>
    </h1>Chernet Business portfolio</h1>
    <p>Web Developer & Biomedical Technician</p>
    <button onclick="toggleTheme()">Change Theme</button>
</header>

<nav>
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#services">Services</a>
    <a href="#projects">Projects</a>
    <a href="#skills">Skills</a>
    <a href="#contact">Contact</a>
    <a href="#certificates">Certificates</a>
</nav>
<section id="home"  > 
<button onclick="showhome()">home</button>
<p id="abouthome"></p></section>
</section>
<section id="about"  >
    <button onclick="showaboutus()">About Us</button>
    <p id="aboutInfo"></p></section>
<section id="services" >
     <button onclick="showservices()">Services</button>
    <P id="servicesInfo"></P>
</section>

<section id="projects" >
     <button onclick="showprojects()">Projects</button>
     <p id="projectsInfo"></p>
</section>
<section id="skills" >
    <button onclick="showskills()">Skills</button>
    <p id="skillsinfo"></p>
</section>
<section id="contact" >
    <button onclick="showContact()">Contact </button>
    <p id="contactInfo"></p>
</section>
<section id="certificates">
<button onclick="showCertificates()">Certificates</button>

<div id="certificatesinfo"></div></section>

<footer>
    <p>© 2026 My Business | All Rights Reserved</p>
</footer>

<script>
 function toggleTheme() {
document.body.classList.toggle("dark");}
function showhome(){let home =  document.getElementById("abouthome");
        if(home.innerText === "")
        {home.innerHTML="<h2>welcome to My Portfolio</h2>"+
        "<p>hello,i'am chernet,FrontEnd WebDeveloper.</p>"+
        "<P> i create responsive and user-friendly Website for business and individuals.</p>";}
        else{home.innerText="";}}

function showaboutus(){let about = document.getElementById("aboutInfo");
        if (about.innerText === "") 
        {about.innerHTML= 
        "We are a professional business offering high-quality services to our clients.<br>"+
        " Our goal is to deliver excellence and build trust."}
        else {about.innerText = "";}}
function showservices() {let services = document.getElementById("servicesInfo")
        if(services.innerText ===""){
        services.innerHTML= 
        "<ul>"+
            "<li>Web Design</li>"+
            "<li>Biomedical Equipment Maintenance</li>"
            "</ul>";}
        else {services.innerText = ""; }}
function showprojects()
         {let projects =  document.getElementById("projectsInfo")
         if (projects.innerText ==="")
         {projects.innerHTML = "<ul>"+
             "<li>Business portfolio</li>"+
             "</ul>";}
         else {projects.innerText = "";}}
function showskills() {
        let skills = document.getElementById("skillsinfo");
        if (skills.innerText === "") {
        skills.innerHTML =
        "<ul>" +
        "<li>HTML</li>" +
        "<li>CSS</li>" +
        "<li>JavaScript</li>" +
        "</ul>";} 
        else {skills.innerText = "";}}
function showContact() 
        {let contact = document.getElementById("contactInfo");
        if (contact.innerText === "") 
        {contact.innerHTML =
        "Email: chernettenaw6@gmail.com <br>"+
        "Phone: +251921904352<br>"+
        "LinkedIn: chernettenaw";} 
        else {contact.innerText = "";}}
function showCertificates() {
        let certificates = document.getElementById("certificatesinfo");

        if (certificates.innerHTML === "") 
        {certificates.innerHTML =
        "<h2>My Certificates</h2>" +
        "<p>Professional training and certifications I have earned.</p>" +
        "<div class='certificate-card'>" +
        "<h3>Computer Maintenance</h3>" +
        "<p>Satcom Institute of Technology</p>" +
        "<a href='computer-maintenance.pdf' target='_blank'>📄 View Certificate</a>" +
        "</div>";}
         else { certificates.innerHTML = "";} }

</script>
</body>
</html>
